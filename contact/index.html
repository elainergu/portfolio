<title>Contact</title>
<link rel="stylesheet" href="../style.css">
<script type="module" src="../global.js"></script>


<h1>Contact</h1>
<form action="mailto:elgu@ucsd.edu" method="POST" enctype="text/plain">
    <label>
        Email
        <input name="email" type="email">
    </label>

    <label>
        Subject
        <input name="subject">
    </label>

    <label>
        Message
        <textarea name="body"></textarea>
    </label>

    <button>Send</button>
</form>
